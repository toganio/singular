name: singular-hosting

# Builds the hosted-agent runtime image and runs it end to end (ledger node + registry + image).
on:
  push:
    branches: [main]
    paths: ["singular/**", ".github/workflows/singular-hosting.yml"]
  pull_request:
    paths: ["singular/**", ".github/workflows/singular-hosting.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: singular-hosting-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build the runtime image
        run: docker build -f singular/hosting/Dockerfile -t singular-runtime:ci .
      - name: End to end (pull, verify, lease, stop, restart)
        run: singular/hosting/e2e.sh singular-runtime:ci
