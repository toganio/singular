[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "singular-agent"
version = "0.1.0"
description = "Singular: sealed, ledger-registered, single-instance, transferable AI agents (Hermes Agent plugin + reference ledger)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = ["cryptography>=42"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
singular = "singular.cli:main"

# Hermes Agent discovers plugins through this entry-point group; the plugin is
# still opt-in per agent (``plugins.enabled`` in the agent's sealed config.yaml).
[project.entry-points."hermes_agent.plugins"]
singular = "singular.hermes_plugin"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
